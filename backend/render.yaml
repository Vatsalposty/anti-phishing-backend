services:
  - type: web
    name: anti-phishing-backend
    env: python
    region: ohio # Optional: Choose a region close to your users if possible, or leave default
    plan: free # Use the free tier
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8 # Specify a stable python version
      - key: PRODUCTION_MODE
        value: true
      - key: FIREBASE_CREDENTIALS
        sync: false # Set in the Render dashboard
      - key: RETRAIN_SECRET
        sync: false # Set in the Render dashboard
